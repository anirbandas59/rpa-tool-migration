# PAD Action Index
# Purpose: one entry per Power Automate Desktop action, keyed by friendly_name/description
# for curation-time search. Complements vbo_catalogue.yaml (BP VBO runtime lookup).
# Distinguishes confirmed (real syntax from PAD source) vs. description-only (PDF name + description,
# no confirmed call site).
#
# Row format: dotted_name (if confirmed), friendly_name, category, description, confidence
# ("confirmed" | "description-only"), syntax (only if confirmed), syntax_source (file:line, only if confirmed).
# Never mark "confirmed" without a real syntax_source citation.
#
# Sources:
# - docs/pad-reference/DF_PID_171_US_Loader.robin.txt
# - docs/pad-reference/DF_PID_171_US_LIMS_Prelude_Main.robin.txt
# - docs/*.robin files
# - samples/pad/*.txt files

