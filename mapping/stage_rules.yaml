# mapping/stage_rules.yaml
# Blue Prism stage type -> Power Automate mapping rules
#
# Generated by Task 2.0 sample analysis from:
#   samples/blueprism/PID_0127_Process_US_BulkUnlock_23March2026_Export.bprelease
#
# Fields:
#   bp_stage_type    — exact string value of the `type` attribute on <stage> in BP XML
#   canonical_type   — the 14-type canonical name used in the Flowsmith AST (CLAUDE.md)
#   pa_target_action — target PAD/Cloud Flow action  (filled in Phase 4)
#   pa_module        — PAD module name               (filled in Phase 4)
#   runtime          — CLOUD or DESKTOP
#   confidence_base  — starting confidence score (0.0–1.0)
#   notes            — human review notes
#
# Stage types that ARE in the 14 canonical types (CLAUDE.md):
# START, END, ACTION, DECISION, CALCULATION, CODE, WAIT,
# NAVIGATE, READ, WRITE, LOOP, EXCEPTION, RECOVER, RESUME
#
# Additional types found in real BP XML that need parser + mapping decisions
# are listed below the canonical set.

# ── Canonical stage types ──────────────────────────────────────────────────

- bp_stage_type: Start
  canonical_type: START
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.95
  notes: "Entry point of a page/sub-sheet. Maps to flow begin node."

- bp_stage_type: End
  canonical_type: END
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.95
  notes: "Exit point of a page/sub-sheet. Maps to flow end node."

- bp_stage_type: Action
  canonical_type: ACTION
  pa_target_action: ""
  pa_module: "External"
  runtime: DESKTOP
  confidence_base: 0.70
  notes: >
    Calls a VBO method (resource/@object + resource/@action).
    Target module depends on which VBO is called — see vbo_catalogue.yaml.
    Confidence varies per VBO; base 0.70 requires spot-check.

- bp_stage_type: Decision
  canonical_type: DECISION
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.85
  notes: "Boolean branch. Maps to If/Condition in PAD or If action in Cloud Flow."

- bp_stage_type: Calculation
  canonical_type: CALCULATION
  pa_target_action: ""
  pa_module: "Variables"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Single variable assignment expression. Maps to Variables.SetVariable
    or a Compose action (Cloud Flow). Expression syntax requires translation.

- bp_stage_type: Code
  canonical_type: CODE
  pa_target_action: ""
  pa_module: "Scripting"
  runtime: DESKTOP
  confidence_base: 0.45
  notes: >
    Inline VBScript/C# code block. No direct PAD equivalent — must be
    rewritten as a PowerShell script action or System.RunScript.
    Low confidence; always review manually.

- bp_stage_type: WaitStart
  canonical_type: WAIT
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.70
  pair_with: WaitEnd
  notes: >
    Start of a Wait block (paired with WaitEnd). Maps to PAD Wait action or
    loop-with-timeout pattern. WaitStart/WaitEnd pairs must be resolved
    together in the AST.

- bp_stage_type: WaitEnd
  canonical_type: WAIT
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.70
  pair_with: WaitStart
  notes: "End of a Wait block — paired with WaitStart. See WaitStart notes."

- bp_stage_type: Navigate
  canonical_type: NAVIGATE
  pa_target_action: ""
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    UI navigation stage (click, launch app, etc.).
    Maps to UIAutomation or Web module actions.

- bp_stage_type: Read
  canonical_type: READ
  pa_target_action: ""
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    Read a value from a UI element or application.
    Maps to UIAutomation.GetAttribute / Web.GetAttributeValueOfElement.

- bp_stage_type: Write
  canonical_type: WRITE
  pa_target_action: ""
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    Write a value to a UI element.
    Maps to UIAutomation.PopulateTextField / Web.SetElementAttribute.

- bp_stage_type: LoopStart
  canonical_type: LOOP
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  pair_with: LoopEnd
  notes: >
    Start of a loop construct (paired with LoopEnd). Loop type determined by
    child elements (collection iterator vs. counter vs. condition).
    AST builder must match LoopStart/LoopEnd pairs.

- bp_stage_type: LoopEnd
  canonical_type: LOOP
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  pair_with: LoopStart
  notes: "End of a loop — paired with LoopStart. See LoopStart notes."

- bp_stage_type: Exception
  canonical_type: EXCEPTION
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  exception_types:
    - "Business Exception"
    - "System Exception"
    - "Action Failed"
    - "Bad Handle"
    - "File Not Found"
    - "Invalid Direction Parameter"
    - "Invalid Input Parameter"
    - "System Unavailable Exception"
    - "UtilityException"
    - "Workbook Not Found"
    - "Worksheet Not Found"
  notes: >
    Throws a typed exception. Maps to BLOCK...ON BLOCK ERROR or
    Error.ThrowError in PAD. Exception detail and type must be preserved.

- bp_stage_type: Recover
  canonical_type: RECOVER
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Enters exception recovery mode. Maps to the ON BLOCK ERROR handler
    branch in PAD. Must be paired with Resume.

- bp_stage_type: Resume
  canonical_type: RESUME
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: "Exits exception recovery and resumes normal flow. Paired with Recover."

