# mapping/stage_rules.yaml
# Blue Prism stage type -> Power Automate mapping rules
#
# Generated by Task 2.0 sample analysis from:
#   samples/blueprism/PID_0127_Process_US_BulkUnlock_23March2026_Export.bprelease
#
# Updated by Task 2c: 18-type canonical reference, Process/Alert/Skill rows, pa_target_action filled
#
# Fields:
#   bp_stage_type    — exact string value of the `type` attribute on <stage> in BP XML
#   canonical_type   — the 18-type canonical name used in the Flowsmith AST (CLAUDE.md):
#                      START, END, ACTION, DECISION, CHOICE, CALCULATION, CODE, WAIT,
#                      NAVIGATE, READ, WRITE, LOOP, EXCEPTION, RECOVER, RESUME,
#                      BLOCK, COLLECTION, DATA
#   pa_target_action — literal PAD/Cloud Flow action template from architecture doc §B12
#   pa_module        — PAD module name (from §B12/§B13)
#   runtime          — CLOUD or DESKTOP
#   confidence_base  — starting confidence score (0.0–1.0)
#   notes            — human review notes
#
# Non-canonical types found in BP XML (mapped to canonical or marked as skip):
# Normalisation: Process → ACTION, Alert → ACTION, Skill → ACTION
# Skip markers: ANCHOR, NOTE, SUBSHEETINFO, PROCESSINFO
# Page-call: SubSheet → ACTION (is_subsheet_call=True), handled by vbo_catalogue
#
# Per architecture doc §B12 and implementation strategy §2.3, every pa_target_action
# is either a literal template from §B12, a reference to VBO rules (§B13), or
# a placeholder for out-of-scope cases (UI selectors — §B9).

# ── Canonical stage types ──────────────────────────────────────────────────

- bp_stage_type: Start
  canonical_type: START
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.95
  notes: >
    Entry point of a page/sub-sheet. No-op marker driving FUNCTION boundaries.
    Main Page START/END drive @INPUT/@OUTPUT directives (architecture doc §A3).
    See §B12.

- bp_stage_type: End
  canonical_type: END
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.95
  notes: >
    Exit point of a page/sub-sheet. No-op marker, no PAD emission.
    Paired with START to drive FUNCTION boundaries. See §B12.

- bp_stage_type: Action
  canonical_type: ACTION
  pa_target_action: ""
  pa_module: "External"
  runtime: DESKTOP
  confidence_base: 0.70
  notes: >
    Calls a VBO method (resource/@object + resource/@action).
    Target module depends on which VBO is called — see vbo_catalogue.yaml.
    Confidence varies per VBO; base 0.70 requires spot-check.

- bp_stage_type: Decision
  canonical_type: DECISION
  pa_target_action: "IF <expr> THEN <true-branch> ELSE <false-branch> END"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.85
  notes: >
    Boolean branch. Template from architecture doc §B12.
    Example: L1421 in DF_PID_171_US_LIMS_Prelude_Main.robin.txt
    Expression requires BP-to-PAD translation per §B10 point 3.

- bp_stage_type: Calculation
  canonical_type: CALCULATION
  pa_target_action: "SET <var> TO <expr>"
  pa_module: "Variables"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Single variable assignment. Template from architecture doc §B12.
    One SET statement per assignment. Sanitize BP identifiers with spaces
    using §A4 prefix scheme (e.g. 'Exception Type' → txt_ExceptionType).
    Expression requires BP-to-PAD translation per §B10 point 3.

- bp_stage_type: Code
  canonical_type: CODE
  pa_target_action: "Scripting.RunDotNetScript Imports: '...' Language: System.DotNetActionLanguageType.CSharp Script: $'''...''' @'name:<param>': ... @<Output>=> <var>"
  pa_module: "Scripting"
  runtime: DESKTOP
  confidence_base: 0.45
  notes: >
    Inline C# code block (not VBScript). Template from architecture doc §B12.
    Confirmed in DF_PID_171_US_LIMS_Prelude_Main.robin.txt L268-388, L75-80.
    Parameter and output mapping requires careful translation.

- bp_stage_type: WaitStart
  canonical_type: WAIT
  pa_target_action: "WAIT <seconds expr>"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.70
  pair_with: WaitEnd
  notes: >
    Start of a Wait block (paired with WaitEnd). Template from architecture doc §B12.
    For static/fixed-duration wait: WAIT <seconds expr>.
    For wait-on-a-value-with-timeout: WAIT (<condition action>) FOR <seconds> ON ERROR ... END.
    Example: L404 in DF_PID_171_US_LIMS_Prelude_Main.robin.txt.
    UI-element-condition wait (dynamic) is a different case handled at VBO level (§B_VBO).

- bp_stage_type: WaitEnd
  canonical_type: WAIT
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.70
  pair_with: WaitStart
  notes: >
    End of a Wait block (paired with WaitStart). No independent PAD emission.
    See WaitStart for full template. WaitStart/WaitEnd pairs resolved together in AST.

- bp_stage_type: Navigate
  canonical_type: NAVIGATE
  pa_target_action: "# TODO: UI selector required"
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    UI navigation stage (click, launch app, etc.). Out of scope per architecture doc §B9.
    Requires appdef/ControlRepository UI selector — never a fabricated appmask[...].
    See §B9 for scope rule.

- bp_stage_type: Read
  canonical_type: READ
  pa_target_action: "# TODO: UI selector required"
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    Read a value from a UI element or application. Out of scope per architecture doc §B9.
    Requires appdef/ControlRepository UI selector — never a fabricated appmask[...].
    See §B9 for scope rule.

- bp_stage_type: Write
  canonical_type: WRITE
  pa_target_action: "# TODO: UI selector required"
  pa_module: "UIAutomation"
  runtime: DESKTOP
  confidence_base: 0.65
  notes: >
    Write a value to a UI element. Out of scope per architecture doc §B9.
    Requires appdef/ControlRepository UI selector — never a fabricated appmask[...].
    See §B9 for scope rule.

- bp_stage_type: LoopStart
  canonical_type: LOOP
  pa_target_action: "LOOP FOREACH <item> IN <collection> ... END | LOOP <var> FROM <start> TO <end> STEP <n> ... END"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  pair_with: LoopEnd
  notes: >
    Start of a loop construct (paired with LoopEnd). Template from architecture doc §B12.
    Two forms: collection loop (FOREACH) for iterating collections,
    counted loop (FROM...TO) for retry/counter loops.
    Loop type determined by BP loop's child elements, not a fixed choice.
    Example counted loop: L243 in DF_PID_171_US_LIMS_Prelude_Main.robin.txt.
    EXIT LOOP / NEXT LOOP map directly.

- bp_stage_type: LoopEnd
  canonical_type: LOOP
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  pair_with: LoopStart
  notes: >
    End of a loop (paired with LoopStart). No independent PAD emission.
    See LoopStart for full template. LoopStart/LoopEnd pairs resolved together in AST.

- bp_stage_type: Exception
  canonical_type: EXCEPTION
  pa_target_action: "FlowControl.ThrowCustomError CustomErrorCode: $'''<exact BP exception type string>''' CustomErrorMessage: <expr>"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  exception_types:
    - "Business Exception"
    - "System Exception"
    - "Action Failed"
    - "Bad Handle"
    - "File Not Found"
    - "Invalid Direction Parameter"
    - "Invalid Input Parameter"
    - "System Unavailable Exception"
    - "UtilityException"
    - "Workbook Not Found"
    - "Worksheet Not Found"
  notes: >
    Throws a typed exception. Template from architecture doc §B12.
    Preserve the BP exception type string verbatim — it is matched by typed
    ON BLOCK ERROR handlers (§A5). Exception type used to classify handling path.
    See exception-handling pattern §B15.

- bp_stage_type: Recover
  canonical_type: RECOVER
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Enters exception recovery mode. No standalone PAD emission.
    Consumed by the enclosing BLOCK's ON BLOCK ERROR handler (§A5 template,
    §B12). Recover stage's contents become the handler body.
    Must be paired with Resume. See §B15.

- bp_stage_type: Resume
  canonical_type: RESUME
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Exits exception recovery and resumes normal flow. No standalone PAD emission.
    Marks where normal execution continues after BLOCK handler (i.e. code
    after the BLOCK's END keyword per §B12). See §B15 exception-handling pattern.

# ── Non-canonical stage types (found in real BP XML, require mapping decision) ─

- bp_stage_type: Anchor
  canonical_type: ""
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.0
  notes: >
    Pure routing artifact (visual line-break for a long edge). No AST node, no PAD output.
    Always skip per architecture doc §B12. Used only by diagram layout engine.

- bp_stage_type: MultipleCalculation
  canonical_type: CALCULATION
  pa_target_action: "SET <var> TO <expr>"
  pa_module: "Variables"
  runtime: DESKTOP
  confidence_base: 0.75
  notes: >
    Multiple simultaneous assignments. Template from architecture doc §B12.
    Emit as N sequential SET statements (fans out to multiple CALCULATION nodes).
    Each assignment follows the same Calculation template.

- bp_stage_type: Block
  canonical_type: BLOCK
  pa_target_action: "BLOCK '<name>' ON BLOCK ERROR ... END <body> END"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.70
  notes: >
    Exception handling scope boundary. Template from architecture doc §B12.
    Emit only when a Recover exists in scope for this Block (paired exception handler).
    BP also uses Block as a pure visual grouping with no handler — emit as **REGION.
    Recovers/Resumes are handled implicitly as part of BLOCK structure per §B15.

- bp_stage_type: Collection
  canonical_type: COLLECTION
  pa_target_action: ""
  pa_module: "Variables"
  runtime: DESKTOP
  confidence_base: 0.60
  notes: >
    Collection (table/list) variable declaration. Template from architecture doc §B12.
    Emit SET var TO <value> only if stage has initial_value or exposure=Environment.
    Otherwise skip — PAD variables declared implicitly on first assignment.
    Conditional emission per §B12.

- bp_stage_type: Data
  canonical_type: DATA
  pa_target_action: ""
  pa_module: "Variables"
  runtime: DESKTOP
  confidence_base: 0.60
  notes: >
    Scalar variable declaration. Template from architecture doc §B12.
    Emit SET var TO <value> only if stage has initial_value or exposure=Environment.
    If exposure=Environment, treat as config-driven read from obj_Config per §B13.
    Otherwise skip — PAD variables declared implicitly on first assignment.
    Conditional emission per §B12.

- bp_stage_type: Note
  canonical_type: ""
  pa_target_action: "# <text>"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.0
  notes: >
    Comment annotation — carries no logic. No AST node (never translatable).
    Optional: if stage carries text (Note's body), emit as # <text> comment.
    Per §B12: only emit if text conveys BP-author intent worth keeping visible.
    Never skip a Note silently if it carries semantically important text.

- bp_stage_type: Process
  canonical_type: ACTION
  pa_target_action: "CALL '<page/subprocess>' ... | Workflow <action> ... (per routing decision)"
  pa_module: "External"
  runtime: DESKTOP
  confidence_base: 0.5
  notes: >
    Normalises to ACTION. Call to another process (sibling page in the same release).
    Usually a desktop-tier CALL like SubSheet — except for the special case:
    BP's single Process-type stage calling RPA_Sharepoint_API_ConfigFile_Download
    maps to Cloud_Main's Try:Init scope → a Cloud Flow Workflow action calling
    CF_PID_171_US_Read Config File (architecture doc §B13 "Process-call special case").
    Flag confidence_base: 0.5 — routing (desktop CALL vs. cloud Workflow action)
    requires reviewer decision, not hardcoded. Implementation strategy §2.3.

- bp_stage_type: ProcessInfo
  canonical_type: ""
  pa_target_action: "# <text>"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.0
  notes: >
    Process metadata (version, narrative, etc). No AST node (never translatable).
    Optional: if stage carries text (narrative/description), emit as # <text> comment.
    Per §B12: only emit if text conveys BP-author intent worth keeping visible.

- bp_stage_type: SubSheet
  canonical_type: ACTION
  pa_target_action: "CALL '<page name>' <Param>: <expr> ... <OutParam>=> <var>"
  pa_module: "External"
  runtime: DESKTOP
  confidence_base: 0.75
  notes: >
    Call to another page/sub-sheet within the same process. Normalises to ACTION.
    Template from architecture doc §B12 (is_subsheet_call=True annotation).
    Example: L1452 in DF_PID_171_US_LIMS_Prelude_Main.robin.txt.
    See vbo_catalogue.yaml for routing when pages are consolidated into FUNCTIONs.

- bp_stage_type: SubSheetInfo
  canonical_type: ""
  pa_target_action: "# <text>"
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.0
  notes: >
    Sub-sheet (page) metadata header (name, narrative). No AST node (skip marker).
    Optional: if stage carries text (narrative/description), emit as # <text> comment
    at the equivalent position in the generated FUNCTION.
    Per §B12: useful as a page-header comment carried over from BP diagram.

# ── Normalisation rows (BP stage types → canonical types) ───────────────────

- bp_stage_type: Alert
  canonical_type: ACTION
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.2
  is_alert: true
  notes: >
    Alert/notification stage. Normalises to ACTION. No confirmed PAD equivalent
    researched yet. STOP — do not use without reviewing expected behavior.
    Low confidence pending curation. See architecture doc §B13.

- bp_stage_type: Skill
  canonical_type: ACTION
  pa_target_action: ""
  pa_module: "System"
  runtime: DESKTOP
  confidence_base: 0.0
  is_skill: true
  notes: >
    Skill/RPA module invocation stage. Normalises to ACTION with is_skill flag.
    Confidence forced to MANUAL band (§B12 and CLAUDE.md).
    Requires expert review and curation before any PAD translation.
