  runtime: DESKTOP
  confidence_base: 0.60
  notes: >
    Scalar variable declaration. Most frequent non-canonical type (2,254).
    Emit as a Variables.SetVariable with the declared initial value, or
    skip (variables are declared implicitly in PAD on first assignment).

