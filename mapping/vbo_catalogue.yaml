# mapping/vbo_catalogue.yaml
# Blue Prism VBO name -> Power Automate module mapping catalogue
#
# Generated by Task 2.0 sample analysis from:
#   samples/blueprism/PID_0127_Process_US_BulkUnlock_23March2026_Export.bprelease
#
# Fields:
#   vbo_name         — exact string from resource/@object attribute in BP XML
#   method_patterns  — method name substrings seen in this sample
#   pa_module        — target PAD module name  (filled in Phase 4)
#   runtime          — CLOUD or DESKTOP
#   confidence_base  — starting confidence score (0.0–1.0)
#   notes            — human review notes
#
# Internal Blue Prism objects (Blueprism.* namespace) are listed separately
# at the bottom — these call built-in BP runtime APIs, not external VBOs.

# ── External / custom VBOs ─────────────────────────────────────────────────

