- vbo_name: "MS Excel VBO"
  method_patterns:
    - "Create Instance"
    - "Open Workbook"
    - "Get Worksheet As Collection"
    - "Get Worksheet Name"
    - "Close Workbook"
    - "Close Instance"
    - "Write Collection"
    - "Save Current Workbook As"
  pa_module: "Excel"
  runtime: DESKTOP
  confidence_base: 0.80
  notes: >
    Maps to PAD Excel module. High method-for-method coverage.
    Verify column/row indexing differences (1-based in BP, 1-based in PAD).
    Method action keys updated per real action="..." strings in PID_0171.bprelease (Task 2b fix pass).
  method_actions:
    "Get Worksheet As Collection": "Excel.ReadFromExcel.ReadAllCells Instance: <ins> GetCellContentsMode: Excel.GetCellContentsMode.PlainText FirstLineIsHeader: True RangeValue=> <var>"
    "Write Collection": "Excel.WriteToExcel.WriteCell Instance: <ins> Value: <val> Column: <n> Row: <n>"
    "Save Current Workbook As": "Excel.SaveExcel.SaveAs Instance: <ins> DocumentFormat: Excel.ExcelFormat.FromExtension DocumentPath: <path>"
  fusion_patterns:
    - sequence: ["Create Instance", "Open Workbook"]
      fused_action: "Excel.LaunchExcel.LaunchAndOpenUnderExistingProcess Path: <path> Visible: False ReadOnly: False UseMachineLocale: False Instance=> <var>"
      vestigial_stages: ["Create Instance"]
    - sequence: ["Close Workbook", "Close Instance"]
      fused_action: "Excel.CloseExcel.Close Instance: <ins>"
      vestigial_stages: ["Close Workbook"]

