# ── Internal Blue Prism runtime objects ───────────────────────────────────
# These are Blueprism.* namespace objects that call BP's own runtime APIs.
# They must be mapped to equivalent Power Platform / PAD native capabilities.

- vbo_name: "Blueprism.Automate.clsWorkQueuesActions"
  method_patterns:
    - "Get Next Item"
    - "Mark Completed"
    - "Mark Exception"
    - "Create Queue Item"
    - "Get Queue Item Count"
    - "Update Queue Item"
    - "Get Queue Statistics"
    - "Delete Queue Item"
    - "Lock Queue Item"
    - "Unlock Queue Item"
    - "Defer Queue Item"
    - "Set Item Tags"
  pa_module: "WorkQueues"
  runtime: DESKTOP
  confidence_base: 0.70
  notes: >
    Blue Prism Work Queue API. Maps to PAD WorkQueues module (Desktop Flow runtime).
    All work queue methods including ProcessWorkQueueItem, UpdateWorkQueueItem,
    EnqueueWorkQueueItem, UpdateProcessingNotes, etc. execute as Desktop Flow actions
    per docs/pad-reference/vbo-action-mapping.md (Work Queues table) and
    DF_PID_171_US_LIMS_Prelude_Main.robin.txt (L1371, L1212, L1140, L1211+).
    Work Queue schema migration required.
  method_actions:
    "Get Next Item": "WorkQueues.ProcessWorkQueueItem.ProcessWorkQueueItem WorkQueue: <id> WorkQueueItem=> <var>"
    "Mark Completed": "WorkQueues.UpdateWorkQueueItem.UpdateWithProcessingNotes WorkQueueItem: <obj> Status: WorkQueues.WorkQueueItemStatus.Processed"
    "Mark Exception": "WorkQueues.UpdateWorkQueueItem.UpdateWithProcessingNotes WorkQueueItem: <obj> Status: WorkQueues.WorkQueueItemStatus.BusinessException ProcessingResult: <msg>"
    "Mark Exception :: ITException": "WorkQueues.UpdateWorkQueueItem.UpdateWithProcessingNotes WorkQueueItem: <obj> Status: WorkQueues.WorkQueueItemStatus.ITException ProcessingResult: <msg>"
    "Mark Exception :: GenericException": "WorkQueues.UpdateWorkQueueItem.UpdateWithProcessingNotes WorkQueueItem: <obj> Status: WorkQueues.WorkQueueItemStatus.GenericException ProcessingResult: <msg>"
    "Update Status": "WorkQueues.UpdateProcessingNotes.WithProcessingNotes WorkQueueItem: <obj> ProcessingNotes: <text>"
  queue_bindings:
    - expression_pattern: "ConfigFileData.Queue Name"
      pad_variable: "txt_WorkQueueId"
      citation: "DF_PID_171_US_LIMS_Prelude_Main.robin.txt L150 (SET txt_WorkQueueId TO obj_Config['Ctrl_WorkQueueId']), L1371 (ProcessWorkQueueItem call site)"
      notes: "Config-driven queue ID from Load Config Data function. txt_WorkQueueId must be assigned from obj_Config['Ctrl_WorkQueueId'] before Get Next Item is called."

