[project]
name = "flowsmith"
version = "0.1.0"
description = "Flowsmith – RPA toolchain to migrate workflows to Power Automate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.2",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "graphviz>=0.21",
]

[project.scripts]
flowsmith="flowsmith.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-rich>=0.1",
    "deepdiff>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=flowsmith --cov-report=term-missing"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/flowsmith"]
omit = ["*/cli/*"]

[tool.coverage.report]
fail_under = 85
